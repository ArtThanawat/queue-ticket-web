<p-toast position="top-right" styleClass="app-toast">
  <ng-template let-message pTemplate="message">
    <div class="flex w-full items-start gap-3 rounded-lg border border-emerald-200 bg-white p-4 shadow-lg">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
        <i class="pi pi-check text-sm"></i>
      </div>

      <div class="min-w-0 flex-1">
        <p class="font-semibold text-slate-950">{{ message.summary }}</p>
        <p class="mt-1 text-sm leading-5 text-slate-600">{{ message.detail }}</p>
      </div>
    </div>
  </ng-template>
</p-toast>
